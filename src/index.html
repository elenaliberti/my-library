<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Cover art and folder icons are user-pasted URLs, so images may come from anywhere; scripts only from the app itself. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src * data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'" />
  <title>My Library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- Skeleton first paint: the real UI replaces this the moment the library is parsed. -->
    <div id="loading" aria-busy="true" aria-label="Loading your library">
      <div class="sk-bar"></div>
      <div class="sk-banner"></div>
      <div class="sk-list">
        <div class="sk-card"><div class="sk-cover"></div><div style="flex:1"><div class="sk-line w60"></div><div class="sk-line w35"></div><div class="sk-line w80"></div></div></div>
        <div class="sk-card"><div class="sk-cover"></div><div style="flex:1"><div class="sk-line w60"></div><div class="sk-line w35"></div><div class="sk-line w80"></div></div></div>
        <div class="sk-card"><div class="sk-cover"></div><div style="flex:1"><div class="sk-line w60"></div><div class="sk-line w35"></div><div class="sk-line w80"></div></div></div>
        <div class="sk-card"><div class="sk-cover"></div><div style="flex:1"><div class="sk-line w60"></div><div class="sk-line w35"></div><div class="sk-line w80"></div></div></div>
        <div class="sk-card"><div class="sk-cover"></div><div style="flex:1"><div class="sk-line w60"></div><div class="sk-line w35"></div><div class="sk-line w80"></div></div></div>
        <div class="sk-card"><div class="sk-cover"></div><div style="flex:1"><div class="sk-line w60"></div><div class="sk-line w35"></div><div class="sk-line w80"></div></div></div>
      </div>
    </div>
  </div>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
